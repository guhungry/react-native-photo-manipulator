import java.nio.file.Paths

buildscript {
  ext.safeExtGet = { String prop ->  
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : project.properties['RNPM_' + prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.5.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion')}"
  }
}

def safeExtGetInt = { String prop ->
  return rootProject.ext.has(prop) ? rootProject.ext.get(prop) : (project.properties['RNPM_' + prop]).toInteger()
}

static def findNodeModulePath(baseDir, packageName) {
    def basePath = baseDir.toPath().normalize()
    // Node's module resolution algorithm searches up to the root directory,
    // after which the base path will be null
    while (basePath) {
        def candidatePath = Paths.get(basePath.toString(), "node_modules", packageName)
        if (candidatePath.toFile().exists()) {
            return candidatePath.toString()
        }
        basePath = basePath.getParent()
    }
    return null
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return project.findProperty("newArchEnabled")?.toString()?.toBoolean() ?: false
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace = "com.guhungry.rnphotomanipulator"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion safeExtGetInt("compileSdkVersion")

  defaultConfig {
    minSdkVersion safeExtGetInt("minSdkVersion")
    targetSdkVersion safeExtGetInt("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

  }

  buildFeatures {
    buildConfig = true
  }

  buildTypes {
    release {
      minifyEnabled = false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          "src/newarch",
          // Codegen specs
          "generated/java",
          "generated/jni"
        ]
      } else {
        java.srcDirs += ["src/oldarch"]
      }
    }
  }
}

def reactNativePath = findNodeModulePath(projectDir, "react-native")

repositories {
  maven {
    // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
    url = "$reactNativePath/android"
  }
  mavenCentral()
  google()
}

def kotlin_version = safeExtGet("kotlinVersion")

dependencies {
  implementation("com.facebook.react:react-native:+")
  implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version")
  implementation("com.guhungry.android:photo-manipulator:1.3.0") {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
  }
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "RNPhotoManipulator"
    codegenJavaPackageName = "com.guhungry.rnphotomanipulator"
  }
}
